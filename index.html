<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Utrux Browser</title>
<link rel="icon" type="image/png" href="c7896133-3991-4070-a5bb-7db2cc9d612a.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Vazirmatn',sans-serif;

    background:
    radial-gradient(circle at center,
    #1e3a8a 0%,
    #081229 35%,
    #020617 100%);

    color:white;

    min-height:100vh;
}

.container{

    max-width:1000px;

    margin:auto;

    padding-top:80px;

    text-align:center;
}

.logo{

    width:120px;

    border-radius:20px;

    box-shadow:
    0 0 60px rgba(37,99,235,.5);

    margin-bottom:20px;
}

h1{

    font-size:34px;

    font-weight:700;

    margin-bottom:35px;
}

.search-box{

    width:min(850px,90%);

    margin:auto;

    background:rgba(255,255,255,.08);

    border:1px solid rgba(255,255,255,.08);

    border-radius:18px;

    display:flex;

    overflow:hidden;

    backdrop-filter:blur(20px);
}

.search-box input{

    flex:1;

    background:none;

    border:none;

    outline:none;

    color:white;

    font-size:18px;

    padding:18px;
}

.search-box input::placeholder{

    color:#a8b3cf;
}

.search-box button{

    width:120px;

    border:none;

    background:#2563eb;

    color:white;

    cursor:pointer;

    font-size:16px;
}

.search-box button:hover{

    background:#3b82f6;
}

.shortcuts{

    margin-top:40px;

    display:flex;

    justify-content:center;

    gap:25px;

    flex-wrap:wrap;
}

.card{
    width:72px;

    text-decoration:none;

    color:white;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:6px;
}

.card img{

    width:54px;

    height:54px;

    border-radius:50%;

    background:rgba(255,255,255,.08);

    padding:10px;

    transition:.25s;
}

.card:hover img{

    transform:translateY(-5px);
}

.card span{
    display:block;
    text-align:center;
    margin-top:4px;
    font-size:12px;
    width:100%;
}

.result{

    background:rgba(255,255,255,.05);

    border:1px solid rgba(255,255,255,.08);

    backdrop-filter:blur(20px);

    border-radius:18px;

    padding:20px;

    margin-bottom:15px;
}

.result a{

    color:#60a5fa;

    font-size:20px;

    text-decoration:none;
}

.result p{

    color:#cbd5e1;

    margin-top:10px;
}
    .letter-icon{

    width:54px;
    height:54px;

    border-radius:50%;

    background:#2563eb;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:24px;
    font-weight:bold;
}
    .suggestion{

    padding:12px 18px;

    cursor:pointer;
}

.suggestion:hover{

    background:#1f2937;
}
    .add-card{

    cursor:pointer;
}

.plus{

    width:54px;
    height:54px;

    border-radius:50%;

    background:rgba(255,255,255,.1);

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:28px;
}
    .shortcuts{
    display:flex !important;
    visibility:visible !important;
    opacity:1 !important;
}

.card{
    display:flex !important;
    flex-direction:column !important;
    align-items:center !important;
    justify-content:center !important;

    visibility:visible !important;
    opacity:1 !important;
}
    .modal{

    display:none;

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.6);

    align-items:center;
    justify-content:center;

    z-index:9999;
}
    .modal-content{

    background:#111827;

    padding:25px;

    border-radius:20px;

    width:300px;

    z-index:10000;
}
#images{

    margin-top:60px;
}

#results{

    margin-top:30px;

    text-align:right;
}
    #suggestions{

    width:min(850px,90%);

    margin:auto;

    background:#111827;

    border-radius:15px;

    overflow:hidden;
}
    #account{

    position:fixed;

    top:20px;
    left:20px;

    background:rgba(255,255,255,.08);

    padding:10px 15px;

    border-radius:15px;

    cursor:pointer;

    backdrop-filter:blur(20px);
}

.modal{

    display:none;

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.6);

    align-items:center;
    justify-content:center;
}

.modal-content{

    background:#111827;

    padding:25px;

    border-radius:20px;

    width:300px;
}

.modal-content input{

    width:100%;

    margin:10px 0;

    padding:12px;
}
</style>

</head>
<body>

<div id="account" onclick="openAccount()">
    👤 کاربر مهمان
</div>

<div id="accountModal" class="modal">

    <div class="modal-content">

        <h2>ساخت حساب</h2>

        <input
        id="username"
        placeholder="نام">

        <input
        id="email"
        placeholder="ایمیل">

        <button onclick="saveAccount()">
            ذخیره
        </button>

    </div>

</div>
    
<div class="container">

    <img src="c7896133-3991-4070-a5bb-7db2cc9d612a.png" class="logo">

    <h1>Utrux Browser</h1>

<div class="search-box">

    <input
    id="query"
    type="text"
    placeholder="هر چیزی را که میخواهید جستجو کنید...">

<button onclick="search()">
جستجو
</button>
</div>


<div class="shortcuts" id="shortcuts">

        <a class="card" href="https://youtube.com">
            <img src="https://www.google.com/s2/favicons?domain=youtube.com&sz=64">
            <span>YouTube</span>
        </a>

        <a class="card" href="https://github.com">
            <img src="https://www.google.com/s2/favicons?domain=github.com&sz=64">
            <span>GitHub</span>
        </a>

        <a class="card" href="https://chatgpt.com">
            <img src="https://www.google.com/s2/favicons?domain=chatgpt.com&sz=64">
            <span>ChatGPT</span>
        </a>

        <a class="card" href="https://wikipedia.org">
            <img src="https://www.google.com/s2/favicons?domain=wikipedia.org&sz=64">
            <span>Wiki</span>
        </a>

</div>

    <script>

function search(){

    const q =
    document.getElementById("query").value.trim();

    if(!q) return;

    window.location.href =
    "https://utruc.github.io/utrux-search/?q="
    + encodeURIComponent(q);

}

function openAccount(){

    document.getElementById("accountModal")
    .style.display = "flex";

}
        function saveAccount(){

    const name =
    document.getElementById("username").value;

    const email =
    document.getElementById("email").value;

    if(!name || !email){

        alert("نام و ایمیل را وارد کنید");

        return;
    }

    localStorage.setItem(
        "utruxUser",
        JSON.stringify({
            name:name,
            email:email
        })
    );

    document.getElementById("account")
    .innerHTML =
    "👤 " + name;

    document.getElementById("accountModal")
    .style.display = "none";

}
</script>
    
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}
</script>
    
</body>
</html>
