<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Utrux Browser</title>
<link rel="icon" type="image/png" href="c7896133-3991-4070-a5bb-7db2cc9d612a.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Vazirmatn',sans-serif;

    background:
    radial-gradient(circle at center,
    #1e3a8a 0%,
    #081229 35%,
    #020617 100%);

    color:white;

    min-height:100vh;
}

.container{

    max-width:1000px;

    margin:auto;

    padding-top:80px;

    text-align:center;
}

.logo{

    width:120px;

    border-radius:20px;

    box-shadow:
    0 0 60px rgba(37,99,235,.5);

    margin-bottom:20px;
}

h1{

    font-size:34px;

    font-weight:700;

    margin-bottom:35px;
}

.search-box{

    width:min(850px,90%);

    margin:auto;

    background:rgba(255,255,255,.08);

    border:1px solid rgba(255,255,255,.08);

    border-radius:18px;

    display:flex;

    overflow:hidden;

    backdrop-filter:blur(20px);
}

.search-box input{

    flex:1;

    background:none;

    border:none;

    outline:none;

    color:white;

    font-size:18px;

    padding:18px;
}

.search-box input::placeholder{

    color:#a8b3cf;
}

.search-box button{

    width:120px;

    border:none;

    background:#2563eb;

    color:white;

    cursor:pointer;

    font-size:16px;
}

.search-box button:hover{

    background:#3b82f6;
}

.shortcuts{

    margin-top:40px;

    display:flex;

    justify-content:center;

    gap:25px;

    flex-wrap:wrap;
}

.card{

    width:72px;

    text-decoration:none;

    color:white;
}

.card img{

    width:54px;

    height:54px;

    border-radius:50%;

    background:rgba(255,255,255,.08);

    padding:10px;

    transition:.25s;
}

.card:hover img{

    transform:translateY(-5px);
}

.card span{

    display:block;

    margin-top:8px;

    font-size:12px;
}

.result{

    background:rgba(255,255,255,.05);

    border:1px solid rgba(255,255,255,.08);

    backdrop-filter:blur(20px);

    border-radius:18px;

    padding:20px;

    margin-bottom:15px;
}

.result a{

    color:#60a5fa;

    font-size:20px;

    text-decoration:none;
}

.result p{

    color:#cbd5e1;

    margin-top:10px;
}
    .letter-icon{

    width:54px;
    height:54px;

    border-radius:50%;

    background:#2563eb;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:24px;
    font-weight:bold;
}
    .suggestion{

    padding:12px 18px;

    cursor:pointer;
}

.suggestion:hover{

    background:#1f2937;
}
    .add-card{

    cursor:pointer;
}

.plus{

    width:54px;
    height:54px;

    border-radius:50%;

    background:rgba(255,255,255,.1);

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:28px;
}
#images{

    margin-top:60px;
}

#results{

    margin-top:30px;

    text-align:right;
}
    #suggestions{

    width:min(850px,90%);

    margin:auto;

    background:#111827;

    border-radius:15px;

    overflow:hidden;
}
</style>

</head>
<body>

<div class="container">

    <img src="c7896133-3991-4070-a5bb-7db2cc9d612a.png" class="logo">

    <h1>Utrux Browser</h1>

    <div class="search-box">

        <input
        id="query"
        type="text"
        placeholder="هر چیزی را که میخواهید جستجو کنید...">

        <button onclick="search()">
            جستجو
        </button>

    </div>

    <div class="shortcuts">

        <a class="card" href="https://youtube.com">
            <img src="https://www.google.com/s2/favicons?domain=youtube.com&sz=64">
            <span>YouTube</span>
        </a>

        <a class="card" href="https://github.com">
            <img src="https://www.google.com/s2/favicons?domain=github.com&sz=64">
            <span>GitHub</span>
        </a>

        <a class="card" href="https://chatgpt.com">
            <img src="https://www.google.com/s2/favicons?domain=chatgpt.com&sz=64">
            <span>ChatGPT</span>
        </a>

        <a class="card" href="https://wikipedia.org">
            <img src="https://www.google.com/s2/favicons?domain=wikipedia.org&sz=64">
            <span>Wiki</span>
        </a>

</div>
<script>

        `;

}

        data.results.forEach(result=>{

                <div class="result">

    function createIcon(name){

    return `
        <div class="letter-icon">
            ${name[0].toUpperCase()}
        </div>
    `;
}
    function renderShortcuts(){

    const shortcuts =
    JSON.parse(localStorage.getItem("shortcuts") || "[]");

    const container =
    document.querySelector(".shortcuts");

    container.innerHTML = "";

    shortcuts.forEach(site=>{

       let domain;

try{
    domain = new URL(site.url).hostname;
}catch{
    domain = site.url
        .replace("https://","")
        .replace("http://","")
        .split("/")[0];
}

        let favicon =
        `https://www.google.com/s2/favicons?domain=${domain}&sz=128`;

        container.innerHTML += `
        <a class="card"
           href="${site.url}"
           target="_blank">

            <img
             src="${favicon}"
             onerror="this.outerHTML=
             '<div class=letter-icon>${site.name[0].toUpperCase()}</div>'">

            <span>${site.name}</span>

        </a>
        `;
    });
}

    query.addEventListener(
"input",
async function(){

    const text = this.value;

    if(text.length < 2) return;

    const res =
    await fetch(
    `https://suggestqueries.google.com/complete/search?client=firefox&q=${encodeURIComponent(text)}`
    );

    const data =
    await res.json();

    showSuggestions(data[1]);
});
    function showSuggestions(list){

    const box =
    document.getElementById("suggestions");

    box.innerHTML = "";

    list.forEach(item=>{

        box.innerHTML += `
        <div
        class="suggestion"
        onclick="selectSuggestion('${item}')">

        ${item}

        </div>
        `;
    });
}
    function selectSuggestion(text){

    document.getElementById("query").value =
    text;

    search();
}
    window.onload = () => {

    renderShortcuts();

};
    setInterval(()=>{

    console.log(
        document.getElementById("shortcuts")
    );

},1000);
</script>

</body>
</html>
