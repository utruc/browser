@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    radial-gradient(circle at center,

.container{

    margin:auto;

}

.logo{

    width:120px;

    border-radius:20px;

    box-shadow:
    0 0 60px rgba(37,99,235,.5);

}

h1{

}

    footer {

  padding: 15px;

  font-family: 'Vazirmatn', sans-serif;
}

.search-box{

    width:min(850px,90%);

    margin:auto;

    background:rgba(255,255,255,.08);

    border:1px solid rgba(255,255,255,.08);

    border-radius:18px;

    display:flex;

    overflow:hidden;

    backdrop-filter:blur(20px);
}

.search-box input{

    flex:1;

    background:none;

    border:none;

    outline:none;

    color:white;

    font-size:18px;

    padding:18px;
}

.search-box input::placeholder{

    color:#a8b3cf;
}

.search-box button{

    width:120px;

    border:none;

    background:#2563eb;

    color:white;

    cursor:pointer;

    font-size:16px;
}

.search-box button:hover{

    background:#3b82f6;
}

.shortcuts{

    margin-top:40px;

    display:flex;

    justify-content:center;

    gap:25px;

    flex-wrap:wrap;
}

.card{
    width:72px;

    text-decoration:none;

    color:white;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:6px;
}

.card img{

    width:54px;

    height:54px;

    border-radius:50%;

    background:rgba(255,255,255,.08);

    padding:10px;

    transition:.25s;
}

.card:hover img{

    transform:translateY(-5px);
}

.card span{
    display:block;
    text-align:center;
    margin-top:4px;
    font-size:12px;
    width:100%;
}

.result{

    background:rgba(255,255,255,.05);

    border:1px solid rgba(255,255,255,.08);

    backdrop-filter:blur(20px);

    border-radius:18px;

    padding:20px;

    margin-bottom:15px;
}

.result a{

    color:#60a5fa;

    font-size:20px;

    text-decoration:none;
}

.result p{

    color:#cbd5e1;

    margin-top:10px;
}
    .letter-icon{

    width:54px;
    height:54px;

    border-radius:50%;

    background:#2563eb;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:24px;
    font-weight:bold;
}
    .suggestion{

    padding:12px 18px;

    cursor:pointer;
}

.suggestion:hover{

    background:#1f2937;
}
    .add-card{

    cursor:pointer;
}

.plus{

    width:54px;
    height:54px;

    border-radius:50%;

    background:rgba(255,255,255,.1);

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:28px;
}
    .shortcuts{
    display:flex !important;
    visibility:visible !important;
    opacity:1 !important;
}

.card{
    display:flex !important;
    flex-direction:column !important;
    align-items:center !important;
    justify-content:center !important;

    visibility:visible !important;
    opacity:1 !important;
}
.modal{

    display:none;

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.6);

    align-items:center;

    justify-content:center;

    z-index:9999;
}
    .modal-content{

    background:#111827;

    padding:25px;

    border-radius:20px;

    width:300px;

    z-index:10000;
}
#images{

    margin-top:60px;
}

#results{

    margin-top:30px;

    text-align:right;
}
    #suggestions{

    width:min(850px,90%);

    margin:auto;

    background:#111827;

    border-radius:15px;

    overflow:hidden;
}
    #account{

    position:fixed;

    top:20px;
    left:20px;

    background:rgba(255,255,255,.08);

    padding:10px 15px;

    border-radius:15px;

    cursor:pointer;

    backdrop-filter:blur(20px);
}

.modal{

    display:none;

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.6);

    align-items:center;
    justify-content:center;
}

.modal-content{

    background:#111827;

    padding:25px;

    border-radius:20px;

    width:300px;
}

.modal-content input{

    width:100%;

    margin:10px 0;

    padding:12px;
}
    .extra-btn{

    width:100%;

    margin-top:10px;

    padding:12px;

    border:none;

    border-radius:12px;

    background:#2563eb;

    color:white;

    font-family:'Vazirmatn',sans-serif;

    cursor:pointer;

    transition:.25s;
}

.extra-btn:hover{

    background:#3b82f6;
}

    .save-btn{

    width:100%;

    margin-top:10px;

    padding:12px;

    border:none;

    border-radius:15px;

    background:rgba(255,255,255,.08);

    color:white;

    font-family:'Vazirmatn',sans-serif;

    cursor:pointer;

    backdrop-filter:blur(20px);

    transition:.25s;
}

.save-btn:hover{

    background:rgba(255,255,255,.15);

}
    .shortcuts-buttons{
  margin-top:20px;
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}
.shortcuts-buttons button{
  padding:10px 15px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:white;
  cursor:pointer;
  font-size:14px;
  transition:.25s;
}
.shortcuts-buttons button:hover{background:#3b82f6;}

.panel{
  margin:15px auto;
  max-width:500px;
  background:#111827;
  padding:15px;
  border-radius:15px;
  display:block;
}

.panel{
  position:fixed;
  right:20px;
  width:300px;
  background:#111827;
  padding:20px;
  border-radius:20px;
  box-shadow:0 0 20px rgba(0,0,0,.5);
  z-index:10000;
}
.panel h3{margin-bottom:12px;text-align:center;}
.panel input, .panel textarea{width:100%;margin:5px 0;padding:10px;border-radius:10px;border:none;}
.panel button{width:100%;padding:10px;margin-top:8px;border:none;border-radius:12px;background:#2563eb;color:white;cursor:pointer;transition:.25s;}
.panel button:hover{background:#3b82f6;}
#downloadList{max-height:200px;overflow-y:auto;margin-top:10px;}
.download-item{background:rgba(255,255,255,.1);padding:8px;margin-bottom:5px;border-radius:10px;font-size:14px;}
    
#extraInfo{

    margin-top:12px;

    background:rgba(255,255,255,.08);

    border-radius:12px;

    padding:12px;

    color:white;

    text-align:right;

    line-height:2;
}
#clock{
    position:fixed;
    bottom:20px;
    left:20px;

    font-size:24px;
    font-weight:bold;
    color:#60a5fa;

    background:rgba(255,255,255,.08);
    padding:10px 15px;
    border-radius:15px;
    backdrop-filter:blur(20px);

    z-index:9999;
}
    #userStats{

    margin-top:15px;

    background:rgba(255,255,255,.08);

    border-radius:12px;

    padding:10px;

    text-align:right;

    color:white;

    font-size:14px;

    line-height:2;
}

#joinDateText,
#searchCountText{

    display:block;
}
    #account{

    position:fixed;

    top:20px;
    left:20px;

    display:flex;

    align-items:center;

    gap:8px;

    background:rgba(255,255,255,.08);

    padding:10px 15px;

    border-radius:15px;

    backdrop-filter:blur(20px);

    cursor:pointer;
}

#avatarPreview{

    width:26px;

    height:26px;

    border-radius:50%;

    object-fit:cover;

    display:none;
}
    #extraShortcuts .card{
    width:72px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6px;
    cursor:pointer;
}
#extraShortcuts .letter-icon{
    width:54px;
    height:54px;
    border-radius:50%;
    background:#2563eb;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    font-weight:bold;
    transition:.25s;
}
#extraShortcuts .card:hover .letter-icon{
    transform:translateY(-5px);
}
#extraShortcuts span{
    font-size:12px;
    text-align:center;
    margin-top:4px;
}
</style>

<body>


<footer style="text-align:center; padding:15px; color:#a8b3cf; font-size:14px;">
  ساخته شده توسط امیر مهدی حیدری &#10084;
</footer>


    
<div id="account" onclick="openAccount()">

    <img id="avatarPreview" src="">

    <span id="accountName">
        👤 کاربر مهمان
    </span>

</div>
<div id="accountModal" class="modal">

    <div class="modal-content">

        <h2>ساخت حساب</h2>

        <input type="file" id="avatar">

        <input id="username" placeholder="نام">

        <input id="email" placeholder="ایمیل">

        <button class="save-btn" onclick="saveAccount()">
            💾 ذخیره
        </button>

        <button class="extra-btn" onclick="toggleInfo()">
            ℹ️ اطلاعات اضافی
        </button>

        <div id="extraInfo" style="display:none">

            <div id="joinDateText"></div>

            <div id="searchCountText"></div>

        </div>

    </div>

</div>    
<div class="container">

    <img src="c7896133-3991-4070-a5bb-7db2cc9d612a.png" class="logo">

    <h1>Utrux Browser</h1>
<div id="clock"></div>
<div class="search-box">

    <input
    id="query"
    type="text"
    placeholder="هر چیزی را که میخواهید جستجو کنید...">

<button onclick="search()">
جستجو
</button>
</div>


<div class="shortcuts" id="shortcuts">

        <a class="card" href="https://youtube.com">
            <img src="https://www.google.com/s2/favicons?domain=youtube.com&sz=64">
            <span>YouTube</span>
        </a>

        <a class="card" href="https://github.com">
            <img src="https://www.google.com/s2/favicons?domain=github.com&sz=64">
            <span>GitHub</span>
        </a>

        <a class="card" href="https://chatgpt.com">
            <img src="https://www.google.com/s2/favicons?domain=chatgpt.com&sz=64">
            <span>ChatGPT</span>
        </a>

        <a class="card" href="https://wikipedia.org">
            <img src="https://www.google.com/s2/favicons?domain=wikipedia.org&sz=64">
            <span>Wiki</span>
        </a>
<div class="shortcuts-buttons">
<div class="shortcuts" id="extraShortcuts">
  <a class="card" href="javascript:void(0)" onclick="togglePanel('downloadPanel')">
    <div class="letter-icon">📥</div>
    <span>دانلود منیجر</span>
  </a>
  <a class="card" href="javascript:void(0)" onclick="togglePanel('calcPanel')">
    <div class="letter-icon">🧮</div>
    <span>ماشین حساب</span>
  </a>
  <a class="card" href="javascript:void(0)" onclick="togglePanel('translatorPanel')">
    <div class="letter-icon">🌐</div>
    <span>مترجم</span>
  </a>
</div>

<div class="panel" id="downloadPanel" style="display:none;">
  <h3>دانلود منیجر</h3>
  <input type="text" id="downloadURL" placeholder="لینک فایل">
  <button onclick="downloadFile()">دانلود</button>
  <div id="downloadList"></div>
</div>

<div class="panel" id="calcPanel" style="display:none;">
  <h3>ماشین حساب</h3>
  <input type="text" id="calcInput" placeholder="مثال: 5+3*2">
  <button onclick="calculate()">محاسبه</button>
  <div id="calcResult"></div>
</div>

<div class="panel" id="translatorPanel" style="display:none;">
  <h3>مترجم</h3>
  <textarea id="translateInput" placeholder="متن خود را وارد کنید"></textarea>
  <button onclick="translateText()">ترجمه</button>
  <div id="translateResult"></div>
</div>
</div>

    <script>

function search(){

    const q =
    document.getElementById("query").value.trim();

    if(!q) return;

    let count =
    Number(localStorage.getItem("searchCount") || 0);

    count++;

    localStorage.setItem(
        "searchCount",
        count
    );

    window.location.href =
    "https://utruc.github.io/utrux-search/?q=" +
    encodeURIComponent(q);
}
function updateClock(){

    const now = new Date();

    document.getElementById("clock").innerHTML =
    now.toLocaleTimeString("fa-IR");

}
function togglePanel(id){
  const panel = document.getElementById(id);
  if(panel.style.display === "none" || panel.style.display === ""){
    panel.style.display = "block";
  } else {
    panel.style.display = "none";
  }
}
  function toggleInfo() {

    const box =
    document.getElementById("extraInfo");

    if (box.style.display === "none" || box.style.display === "") {

        box.style.display = "block";

    } else {

        box.style.display = "none";

    }

}
        if(!localStorage.getItem("joinDate")){

   localStorage.setItem(
      "joinDate",
      new Date().toLocaleDateString("fa-IR")
   );

}

const file =
document.getElementById("avatar").files[0];

if(file){
   const reader = new FileReader();

   reader.onload = () => {
      localStorage.setItem(
         "avatar",
         reader.result
      );
   };

   reader.readAsDataURL(file);
}

setInterval(updateClock,1000);

updateClock();
        
// باز کردن پنل حساب
function openAccount(){

    document.getElementById(
        "accountModal"
    ).style.display = "flex";

    const user =
    JSON.parse(
        localStorage.getItem("utruxUser")
    );

    if(user){

        document.getElementById(
            "username"
        ).value = user.name || "";

        document.getElementById(
            "email"
        ).value = user.email || "";

    }

}
// ذخیره اطلاعات کاربر
    function saveAccount() {
    const name = document.getElementById("username").value.trim();
    const email = document.getElementById("email").value.trim();

    if (!name || !email) {
        alert("لطفاً نام و ایمیل را وارد کنید");
        return;
    }
        if(!localStorage.getItem("joinDate")){

    localStorage.setItem(
        "joinDate",
        new Date().toLocaleDateString("fa-IR")
    );

}
        document.getElementById("accountModal").style.display = "none";

    // ذخیره در LocalStorage
    localStorage.setItem("utruxUser", JSON.stringify({ name, email }));

    // بارگذاری اطلاعات برای نمایش در صفحه
    loadUser();

    // بستن پنل حساب
    document.getElementById("accountModal").style.display = "none";
}

// بارگذاری اطلاعات کاربر هنگام لود صفحه
function loadUser() {

    const user =
    JSON.parse(localStorage.getItem("utruxUser"));

    if(user){

document.getElementById(
    "accountName"
).textContent = "👤 " + user.name;

    }
        
    const joinDate =
    localStorage.getItem("joinDate") || "ثبت نشده";

    const searchCount =
    localStorage.getItem("searchCount") || 0;

    document.getElementById("joinDateText").innerHTML =
    "📅 تاریخ عضویت: " + joinDate;

    document.getElementById("searchCountText").innerHTML =
    "🔎 تعداد جستجوهای شما : " + searchCount;
}
// اطمینان از بارگذاری اطلاعات هنگام شروع صفحه
window.addEventListener("DOMContentLoaded", loadUser);

// دانلود منیجر
let downloads = [];
function downloadFile(){
  const url = document.getElementById("downloadURL").value.trim();
  if(!url) return;
  const fileName = url.split("/").pop();
  const a = document.createElement("a");
  a.href = url;
  a.download = fileName || "file";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  downloads.push(fileName);
  updateDownloadList();
  document.getElementById("downloadURL").value = "";
}
function updateDownloadList(){
  const list = document.getElementById("downloadList");
  list.innerHTML = "";
  downloads.forEach(f=>{
    const div = document.createElement("div");
    div.className = "download-item";
    div.textContent = f;
    list.appendChild(div);
  });
}

// ماشین حساب
function calculate(){
  const input = document.getElementById("calcInput").value.trim();
  if(!input) return;
  try{
    const result = eval(input);
    document.getElementById("calcResult").textContent = "نتیجه: " + result;
  }catch(e){
    document.getElementById("calcResult").textContent = "ورودی نامعتبر";
  }
}

// مترجم (نمونه ساده)
function translateText(){
  const text = document.getElementById("translateInput").value.trim();
  if(!text) return;
  const translated = text.split("").reverse().join(""); // فقط جهت تست
  document.getElementById("translateResult").textContent = translated;
}
        
</script>

<footer style="text-align:center; padding:15px; color:#a8b3cf; font-size:14px;">
  ساخته شده توسط امیر مهدی حیدری &#10084;
</footer>
        
</body>
