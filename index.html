<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Utrux Browser</title>
<link rel="icon" type="image/png" href="c7896133-3991-4070-a5bb-7db2cc9d612a.png">
<style>
body{
    margin:0;
    min-height:100vh;
    font-family:Inter,Tahoma,sans-serif;
    background:
    radial-gradient(circle at top,#1e3a8a 0%,#0f172a 40%,#020617 100%);
    color:white;
}

.container{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.logo{
    width:140px;
    margin-bottom:25px;
}

.search-box{
    width:min(800px,90%);
    backdrop-filter:blur(20px);
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.1);
    border-radius:25px;
    display:flex;
    padding:8px;
    box-shadow:
    0 10px 40px rgba(0,0,0,.4);
}

.search-box input{
    flex:1;
    background:none;
    border:none;
    color:white;
    padding:15px;
    font-size:18px;
    outline:none;
}

.search-box button{
    border:none;
    background:#2563eb;
    color:white;
    border-radius:18px;
    padding:0 25px;
    cursor:pointer;
}

    .shortcuts{
    margin-top:40px;
    display:grid;
    grid-template-columns:repeat(4,120px);
    gap:20px;
}

.card{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.1);
    border-radius:20px;
    height:120px;

    display:flex;
    align-items:center;
    justify-content:center;

    backdrop-filter:blur(20px);

    transition:.25s;
}

.card:hover{
    transform:translateY(-5px);
}
    
</style>

</head>
<body>

<div class="container">

    <div class="logo">Utrux Browser</div>

<div class="shortcuts">

  <div class="card">YouTube</div>
  <div class="card">GitHub</div>
  <div class="card">ChatGPT</div>
  <div class="card">Wikipedia</div>

</div>
    
    <div class="search-box">
        <input
            type="text"
            id="query"
            placeholder="هر چیزی را جستجو کنید..."
            onkeypress="if(event.key==='Enter') search()"
        >
        <button onclick="search()">جستجو</button>
    </div>

    <div id="images"></div>
<div id="results"></div>
    <div id="results"></div>

</div>

<script>

const API_KEY = "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";
const PEXELS_API_KEY = "LBX1wKWqpXvrZQLXA6xbDaZ376NBhcDZmPAAgBeKyFNF5FtYlpYRBeXw";
async function search(){

    const query = document.getElementById("query").value.trim();

    const pexelsResponse = await fetch(
    `https://api.pexels.com/v1/search?query=${encodeURIComponent(query)}&per_page=12`,
    {
        headers: {
            Authorization: PEXELS_API_KEY
        }
    }
);

const pexelsData = await pexelsResponse.json();

    if(!query) return;

    const resultsDiv = document.getElementById("results");

    resultsDiv.innerHTML = "<h3>در حال جستجو...</h3>";

    try{

        const response = await fetch(
            "https://api.tavily.com/search",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
body:JSON.stringify({
    api_key:API_KEY,
    query:query,
    max_results:10,
    search_depth:"basic",
    include_images:true
        })
            }
        );

        const data = await response.json();

        const imagesDiv = document.getElementById("images");

imagesDiv.innerHTML = "";

if(data.images && data.images.length){

    imagesDiv.innerHTML = "<h2>تصاویر</h2>";

    data.images.forEach(img => {

        imagesDiv.innerHTML += `
            <img
                src="${img}"
                style="
                width:200px;
                height:150px;
                object-fit:cover;
                margin:5px;
                border-radius:10px;
                ">
        `;

    });

}

        resultsDiv.innerHTML = "";

        if(!data.results || data.results.length===0){

            resultsDiv.innerHTML =
            "<h3>نتیجه‌ای پیدا نشد.</h3>";

            return;
        }

        data.results.forEach(result=>{

            resultsDiv.innerHTML += `
                <div class="result">
                    <a href="${result.url}" target="_blank">
                        ${result.title}
                    </a>

                    <p>
                        ${result.content || ""}
                    </p>

                    <small>${result.url}</small>
                </div>
            `;

        });

    }catch(error){

        console.error(error);

        resultsDiv.innerHTML =
        "<h3>خطا در اتصال به API</h3>";
    }

}
</script>

</body>
</html>
